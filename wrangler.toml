# Paulian Sync relay: the template that "Deploy to Cloudflare" uses. Works on the Workers FREE plan.
# No account name, route or domain in here: your relay lives at https://<worker-name>.<your-subdomain>.workers.dev
name = "paulian-sync-server"
main = "src/index.ts"
# Set this to a recent date when you update the project.
compatibility_date = "2026-10-01"

# Your relay's address (the one you paste into Paulian Calendar) is the workers.dev address.
workers_dev = true

# Free plan: Durable Objects must use the SQLite storage backend (the migrations below do that).
# One Durable Object per sync group, plus a short-lived pairing mailbox per pairing id.
[[durable_objects.bindings]]
name = "GROUPS_V2"
class_name = "GroupV2DO"

[[durable_objects.bindings]]
name = "PAIRS"
class_name = "PairDO"

# Durable Object migrations: an ordered history. Cloudflare remembers the last tag a Worker has applied and runs only the
# entries after it, so NEVER edit, remove or reorder an existing entry; only append new ones.
#   - a NEW relay applies all three entries in order and ends with GroupV2DO and PairDO (GroupDO is created and removed again);
#   - a relay deployed from version 1.0.x / 1.1.x (tag "v2") applies only "v3", which deletes the old, unused GroupDO
#     (the old protocol's data) and leaves your sync groups (GroupV2DO) and the pairing mailbox (PairDO) untouched.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GroupV2DO", "PairDO"]

[[migrations]]
tag = "v3"
deleted_classes = ["GroupDO"]

# Per-IP rate limit in front of the per-group limits (Workers Rate Limiting API). Needs no setup.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[vars]
# Delete a group's data after this many days without any sync activity (and prune snapshot-covered history of that age).
RETENTION_DAYS_V2 = "90"

[observability]
enabled = false   # do not keep request logs (privacy)
